[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unigeom"
version = "0.1.0"
readme = "README.md"
description = "Calibrated interfaces for frozen visual representations and receiver dynamics"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Anonymous-for-Sub/UniGeom"
Issues = "https://github.com/Anonymous-for-Sub/UniGeom/issues"
